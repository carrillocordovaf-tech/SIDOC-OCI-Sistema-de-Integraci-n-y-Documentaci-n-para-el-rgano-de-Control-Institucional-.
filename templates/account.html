{% extends 'base.html' %}{% block content %}<div class="title-row"><div><h1>Mi cuenta</h1><p>{{g.user.username}} · {{'Administrador' if g.user.role == 'admin' else 'Personal'}}</p></div></div><section class="panel"><h2>Cambiar contraseña</h2><form method="post">{{csrf()}}<div class="form-grid"><div class="field"><label for="current">Contraseña actual</label><input id="current" name="current" type="password" required autocomplete="current-password"></div><div class="field"><label for="new-password">Nueva contraseña (mínimo 12 caracteres)</label><input id="new-password" name="password" type="password" required minlength="12" autocomplete="new-password"></div></div><div class="form-actions"><button class="primary">Cambiar contraseña</button></div></form></section><form method="post" action="{{url_for('logout')}}">{{csrf()}}<button class="secondary">Cerrar sesión</button></form>{% endblock %}
