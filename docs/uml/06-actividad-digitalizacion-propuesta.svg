<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1253px" preserveAspectRatio="none" style="width:797px;height:1253px;background:#FFFFFF;" version="1.1" viewBox="0 0 797 1253" width="797px" zoomAndPan="magnify"><title>SIDOC-OCI &#8212; Digitalizaci&#243;n de archivo hist&#243;rico</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="331.0287" x="231.6908" y="38.5359">SIDOC-OCI &#8212; Digitalizaci&#243;n de archivo hist&#243;rico</text><ellipse cx="290.9979" cy="64.0999" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="43.0999" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="313.6628" x="134.1665" y="94.0999"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="293.6628" x="144.1665" y="122.6358">Identificar expediente f&#237;sico y a&#241;os de origen</text><rect fill="#F1F1F1" height="43.0999" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="208.1033" x="186.9462" y="157.1998"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="188.1033" x="196.9462" y="185.7357">Asignar c&#243;digo de inventario</text><rect fill="#F1F1F1" height="66.1998" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="244.3911" x="168.8023" y="220.2997"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.3911" x="178.8023" y="248.8356">Registrar sede, ambiente, estante,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="127.8335" x="178.8023" y="271.9355">nivel, caja y carpeta</text><rect fill="#F1F1F1" height="66.1998" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="300.881" x="140.5574" y="306.4995"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="280.881" x="150.5574" y="335.0354">Registrar responsable, folios, conservaci&#243;n</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.2995" x="150.5574" y="358.1353">y estado Pendiente</text><rect fill="#F1F1F1" height="43.0999" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="291.067" x="145.4644" y="392.6993"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="271.067" x="155.4644" y="421.2352">Preparar originales y escanear por tomos</text><rect fill="#F1F1F1" height="43.0999" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="140.3996" x="220.7981" y="455.7992"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="120.3996" x="230.7981" y="484.3351">Estado En proceso</text><rect fill="#F1F1F1" height="66.1998" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="297.5209" x="142.2374" y="518.8991"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="213.0652" x="152.2374" y="547.435">Generar PDF y cargar cada parte</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="277.5209" x="152.2374" y="570.5349">mediante el m&#243;dulo documental existente</text><rect fill="#F1F1F1" height="66.1998" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="222.5932" x="179.7013" y="605.0989"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.5932" x="189.7013" y="633.6348">Vincular PDF con registro f&#237;sico</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="162.8754" x="189.7013" y="656.7347">y nombrar tomo o anexo</text><polygon fill="#F1F1F1" points="191.8783,695.4626,390.1175,695.4626,402.1175,707.4626,390.1175,719.4626,191.8783,719.4626,179.8783,707.4626,191.8783,695.4626" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="198.2392" x="191.8783" y="714.4485">&#191;Faltan partes del expediente?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="11.298" x="168.5803" y="702.8986">S&#237;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="19.1099" x="402.1175" y="702.8986">No</text><rect fill="#F1F1F1" height="43.0999" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="193.0534" x="34.4149" y="729.4626"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.0534" x="44.4149" y="757.9985">Estado Digitalizado parcial</text><rect fill="#F1F1F1" height="43.0999" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="239.8832" x="11" y="792.5625"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.8832" x="21" y="821.0984">Programar digitalizaci&#243;n restante</text><rect fill="#F1F1F1" height="43.0999" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="145.5935" x="378.2574" y="729.4626"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.5935" x="388.2574" y="757.9985">Estado Digitalizado</text><rect fill="#F1F1F1" height="66.1998" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="260.9671" x="320.5706" y="792.5625"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="169.6653" x="330.5706" y="821.0984">Revisar legibilidad, orden,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.9671" x="330.5706" y="844.1983">folios y correspondencia con original</text><polygon fill="#F1F1F1" points="411.9663,882.9261,490.142,882.9261,502.142,894.9261,490.142,906.9261,411.9663,906.9261,399.9663,894.9261,411.9663,882.9261" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.1757" x="411.9663" y="901.9121">&#191;Conforme?</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="11.298" x="388.6684" y="890.3622">S&#237;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="19.1099" x="502.142" y="890.3622">No</text><rect fill="#F1F1F1" height="43.0999" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="126.8616" x="280.8832" y="916.9261"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="106.8616" x="290.8832" y="945.4621">Estado Revisado</text><rect fill="#F1F1F1" height="43.0999" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="260.0991" x="427.7448" y="916.9261"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240.0991" x="437.7448" y="945.4621">Corregir escaneo o completar partes</text><polygon fill="#F1F1F1" points="451.0542,966.026,463.0542,978.026,451.0542,990.026,439.0542,978.026,451.0542,966.026" style="stroke:#181818;stroke-width:0.5;"/><polygon fill="#F1F1F1" points="290.9979,996.026,302.9979,1008.026,290.9979,1020.026,278.9979,1008.026,290.9979,996.026" style="stroke:#181818;stroke-width:0.5;"/><rect fill="#F1F1F1" height="66.1998" rx="5" ry="5" style="stroke:#181818;stroke-width:0.5;" width="221.6692" x="180.1633" y="1040.026"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="201.6692" x="190.1633" y="1068.562">Conservar original e identificar</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="170.6593" x="190.1633" y="1091.6619">su ubicaci&#243;n f&#237;sica vigente</text><path d="M321.9979,1116.2258 L321.9979,1174.9756 L301.9979,1178.9756 L321.9979,1182.9756 L321.9979,1241.7253 A0,0 0 0 0 321.9979,1241.7253 L785.4102,1241.7253 A0,0 0 0 0 785.4102,1241.7253 L785.4102,1126.2258 L775.4102,1116.2258 L321.9979,1116.2258 A0,0 0 0 0 321.9979,1116.2258" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M775.4102,1116.2258 L775.4102,1126.2258 L785.4102,1126.2258 L775.4102,1116.2258" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="442.4123" x="327.9979" y="1139.7618">Administrador: inventar&#237;a, vincula PDF y actualiza ubicaci&#243;n/estado.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="346.8067" x="327.9979" y="1162.8617">Personal: consulta inventario propio y carga sus PDF.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="272.719" x="327.9979" y="1185.9616">Cada cambio del original genera historial.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="254.547" x="327.9979" y="1209.0615">La verificaci&#243;n del escaneo es humana.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="403.8704" x="327.9979" y="1232.1614">Requiere migraci&#243;n 0004 y despliegue del c&#243;digo actualizado.</text><ellipse cx="290.9979" cy="1178.9756" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="290.9979" cy="1178.9756" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#185B46;stroke-width:1;" x1="290.9979" x2="290.9979" y1="74.0999" y2="94.0999"/><polygon fill="#185B46" points="286.9979,84.0999,290.9979,94.0999,294.9979,84.0999,290.9979,88.0999" style="stroke:#185B46;stroke-width:1;"/><line style="stroke:#185B46;stroke-width:1;" x1="290.9979" x2="290.9979" y1="137.1998" y2="157.1998"/><polygon fill="#185B46" points="286.9979,147.1998,290.9979,157.1998,294.9979,147.1998,290.9979,151.1998" style="stroke:#185B46;stroke-width:1;"/><line style="stroke:#185B46;stroke-width:1;" x1="290.9979" x2="290.9979" y1="200.2997" y2="220.2997"/><polygon fill="#185B46" points="286.9979,210.2997,290.9979,220.2997,294.9979,210.2997,290.9979,214.2997" style="stroke:#185B46;stroke-width:1;"/><line style="stroke:#185B46;stroke-width:1;" x1="290.9979" x2="290.9979" y1="286.4995" y2="306.4995"/><polygon fill="#185B46" points="286.9979,296.4995,290.9979,306.4995,294.9979,296.4995,290.9979,300.4995" style="stroke:#185B46;stroke-width:1;"/><line style="stroke:#185B46;stroke-width:1;" x1="290.9979" x2="290.9979" y1="372.6993" y2="392.6993"/><polygon fill="#185B46" points="286.9979,382.6993,290.9979,392.6993,294.9979,382.6993,290.9979,386.6993" style="stroke:#185B46;stroke-width:1;"/><line style="stroke:#185B46;stroke-width:1;" x1="290.9979" x2="290.9979" y1="435.7992" y2="455.7992"/><polygon fill="#185B46" points="286.9979,445.7992,290.9979,455.7992,294.9979,445.7992,290.9979,449.7992" style="stroke:#185B46;stroke-width:1;"/><line style="stroke:#185B46;stroke-width:1;" x1="290.9979" x2="290.9979" y1="498.8991" y2="518.8991"/><polygon fill="#185B46" points="286.9979,508.8991,290.9979,518.8991,294.9979,508.8991,290.9979,512.8991" style="stroke:#185B46;stroke-width:1;"/><line style="stroke:#185B46;stroke-width:1;" x1="290.9979" x2="290.9979" y1="585.0989" y2="605.0989"/><polygon fill="#185B46" points="286.9979,595.0989,290.9979,605.0989,294.9979,595.0989,290.9979,599.0989" style="stroke:#185B46;stroke-width:1;"/><line style="stroke:#185B46;stroke-width:1;" x1="130.9416" x2="130.9416" y1="772.5625" y2="792.5625"/><polygon fill="#185B46" points="126.9416,782.5625,130.9416,792.5625,134.9416,782.5625,130.9416,786.5625" style="stroke:#185B46;stroke-width:1;"/><line style="stroke:#185B46;stroke-width:1;" x1="451.0542" x2="451.0542" y1="772.5625" y2="792.5625"/><polygon fill="#185B46" points="447.0